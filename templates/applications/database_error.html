{% extends "base.html" %}

{% block title %}Database unavailable · Job Tracker{% endblock %}

{% block content %}
<div class="alert alert-warning" role="alert">
    <h1 class="h4">Can’t reach the application database</h1>

</div>
{% endblock %}
